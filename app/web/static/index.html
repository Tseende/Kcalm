<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Дневник питания</title>
  <link rel="icon" href="data:,">
  <script>
    // Применяем сохранённую тему до первой отрисовки. В режиме «Как в системе» слушаем Telegram или браузер.
    window.telegramReady = new Promise(function (resolve) {
      if (new URLSearchParams(location.search).get('mock') === '1') {
        resolve();
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://telegram.org/js/telegram-web-app.js';
      script.async = true;
      function done() {
        clearTimeout(timer);
        script.onload = script.onerror = null;
        resolve();
      }
      var timer = setTimeout(function () { script.remove(); done(); }, 4000);
      script.onload = script.onerror = done;
      document.head.appendChild(script);
    });
    document.addEventListener('error', function (event) {
      if (event.target.id !== 'app-entry') return;
      var loader = document.getElementById('boot');
      if (!loader) return;
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'btn btn-secondary';
      var lang = new URLSearchParams(location.search).get('lang');
      retry.textContent = (lang || document.documentElement.lang) === 'en'
        ? 'Reload the app' : 'Перезагрузить приложение';
      retry.onclick = function () { location.reload(); };
      loader.replaceChildren(retry);
    }, true);
    function applyTheme() {
      var d = document.documentElement, scheme = 'light';
      try {
        var p = localStorage.getItem('theme'), tg = window.Telegram && Telegram.WebApp;
        if (p === 'light' || p === 'dark' || p === 'cosmic') {
          scheme = p;
        } else {
          var dark = tg && tg.initData && tg.colorScheme ? tg.colorScheme === 'dark'
            : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          scheme = dark ? 'dark' : 'light';
        }
      } catch (e) { /* без хранилища */ }
      d.classList.remove('scheme-light', 'scheme-dark', 'scheme-cosmic');
      d.classList.add('scheme-' + scheme);
    }
    applyTheme();
    window.telegramReady.then(applyTheme);
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/coach.css">
</head>
<body>
  <div id="boot" class="boot"><div class="spinner"></div></div>
  <main id="view" aria-live="polite"></main>
  <div id="mainbar" class="mainbar" hidden></div>
  <nav id="tabbar" class="tabbar" aria-label="Разделы" hidden></nav>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Для работы приложения нужен JavaScript. / JavaScript is required.</noscript>
  <script type="module" id="app-entry" src="js/main.js"></script>
</body>
</html>
