<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Дневник питания</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css?v=113">
  <link rel="stylesheet" href="css/coach.css?v=113">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Тема до первой отрисовки (без вспышки светлого): ключ 'theme' (light/dark), иначе Telegram или система.
    (function () {
      var d = document.documentElement, dark;
      try {
        var p = localStorage.getItem('theme'), tg = window.Telegram && Telegram.WebApp;
        dark = p === 'dark' || p === 'light' ? p === 'dark'
          : tg && tg.initData && tg.colorScheme ? tg.colorScheme === 'dark'
          : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) { dark = false; }
      d.classList.add(dark ? 'scheme-dark' : 'scheme-light');
    })();
  </script>
</head>
<body>
  <div id="boot" class="boot"><div class="spinner"></div></div>
  <main id="view" aria-live="polite"></main>
  <div id="mainbar" class="mainbar" hidden></div>
  <nav id="tabbar" class="tabbar" aria-label="Разделы" hidden></nav>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Для работы приложения нужен JavaScript. / JavaScript is required.</noscript>
  <script type="module" src="js/main.js?v=114"></script>
</body>
</html>
