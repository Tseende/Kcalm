<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новая посуда</title><style>:root{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color-scheme:light dark;background:#f2f2f7;color:#202024}body{max-width:900px;margin:35px auto;padding:0 20px}h1{font-size:30px;margin-bottom:8px}p{color:#62626a;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;background:white;border-radius:20px;padding:18px 10px;text-align:center;display:grid;justify-items:center;gap:12px}img{width:112px;height:112px;object-fit:contain}figcaption{font-size:14px;line-height:1.4}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-color-scheme:dark){:root{background:#101012;color:#f4f4f6}figure{background:#252528}p{color:#aaaab2}}</style><h1>Новые варианты посуды</h1><p>Восемь дополнительных вариантов для «Моей посуды». Размер, глубину и объём своей посуды задавай отдельно.</p><div class="grid"><figure><img src="../app/web/static/img/dish/dessert_plate.webp" alt="Десертная тарелка"><figcaption>Десертная тарелка</figcaption></figure><figure><img src="../app/web/static/img/dish/square_plate.webp" alt="Квадратная тарелка"><figcaption>Квадратная тарелка</figcaption></figure><figure><img src="../app/web/static/img/dish/oval_plate.webp" alt="Овальная тарелка"><figcaption>Овальная тарелка</figcaption></figure><figure><img src="../app/web/static/img/dish/rectangular_plate.webp" alt="Прямоугольная тарелка"><figcaption>Прямоугольная тарелка</figcaption></figure><figure><img src="../app/web/static/img/dish/pasta_plate.webp" alt="Тарелка для пасты"><figcaption>Тарелка для пасты</figcaption></figure><figure><img src="../app/web/static/img/dish/divided_plate.webp" alt="Тарелка с секциями"><figcaption>Тарелка с секциями</figcaption></figure><figure><img src="../app/web/static/img/dish/platter.webp" alt="Большое блюдо"><figcaption>Большое блюдо</figcaption></figure><figure><img src="../app/web/static/img/dish/ramekin.webp" alt="Форма для запекания"><figcaption>Форма для запекания</figcaption></figure></div><p>Для квадратной тарелки укажи сторону, для овальной или прямоугольной — наибольшую длину. Изображения не задают размер или объём автоматически.</p></html>
